# deagle CI — coverage (cargo-tarpaulin) + complexity (cargo-crap) gates.
#
# One job, one coverage run, two gates fed by it: tarpaulin runs the whole
# suite under instrumentation (it exits non-zero on any test failure, so the
# coverage run IS the test run) and writes lcov.info, which cargo-crap then
# scores. cargo-crap never runs tests itself — it parses source with syn and
# reads the LCOV, scoring CRAP(m) = CC²·(1−cov)³ + CC. Without the coverage
# feed every function scores cov=0 and CRAP collapses to CC³+CC, so the
# complexity gate would measure nothing; that is why the two live in one job.
#
# Public repo, so the repo's existing convention (ubuntu-latest, as in
# docs.yml) is kept.
#
# Tool pinning: both tools install from per-arch release tarballs at exact
# versions and each version is asserted — two runs cannot disagree because one
# host happened to have a newer cargo-crap. Versions are crates.io
# max_stable_version at authoring: tarpaulin 0.37.5, cargo-crap 0.6.1.
#
# Engine choice is MEASURED, not preferred. `--engine Ptrace` was the first
# choice and is BLOCKED on the fleet's self-hosted runners (sysbox-confined
# containers: "ASLR disable failed: EPERM"); `auto` would fall back silently.
# `Llvm` is the documented llvm-profdata path and is what the
# llvm-tools-preview component above installs. Local measurement on the build
# host runs the same suite under ptrace; llvm-vs-ptrace coverage deltas on
# comparable suites are inside the floor's ~3pp margin, and the thresholds in
# this file carry that margin deliberately.
#
# deagle pins its toolchain in rust-toolchain.toml (1.99.0, edition 2024), so
# the toolchain step requests that exact channel rather than floating stable.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only, and no job needs more: nothing here pushes, tags, publishes, or
# reads a secret. Least privilege so a compromised step still cannot write to
# the repository.
permissions:
  contents: read

# A superseded run's green tick is worthless: when a branch is pushed again,
# cancel the in-flight run for the same ref rather than let it race. Keyed on
# the ref, so PR runs for different PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-crap:
    name: coverage + CRAP
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Repo-specific constants, measured on the first run — see the PR that
      # added this job for the numbers and the ratchet.
      #
      # Measured under tarpaulin 0.37.5 / ptrace on the build host:
      #   line coverage 71.44% (1328/1859 lines); all tests passing.
      #   worst maintained-surface CRAP 182.0 = deagle-parse::walk_search
      #   (crates/deagle-parse/src/text_search.rs:81, CC 13, coverage
      #   unmeasured under the ptrace run — see PR body caveat; pessimistic
      #   scoring makes it an upper bound).
      # Floor = measured − ~3pp (ptrace-vs-llvm engine variance);
      # ceiling = measured max + ~10% headroom.
      COVERAGE_FLOOR: "68"
      CRAP_THRESHOLD: "200"
    steps:
      - name: checkout
        # Pinned to an immutable commit SHA (resolved from the v5.1.0 tag),
        # never the moving `@v5` tag — same commit the proven estate jobs use.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: install toolchain (llvm-tools-preview)
        # Pinned to an immutable commit SHA of the `stable` branch.
        # rust-toolchain.toml pins 1.99.0 (edition 2024); requesting that exact
        # channel keeps CI on the repo's declared toolchain instead of
        # floating. llvm-tools-preview backs the llvm engine and any
        # llvm-profdata/llvm-cov invocation.
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: "1.99.0"
          components: llvm-tools-preview

      - name: Cargo.lock is committed, not generated
        # --locked below exits non-zero if the lockfile is missing or would have
        # to change, so the dependency set can only move when a human commits a
        # reviewed lockfile. That mechanism needs the file to exist first.
        run: git ls-files --error-unmatch Cargo.lock

      - name: install pinned coverage + CRAP tools
        run: |
          set -euo pipefail
          TARPAULIN_VERSION=0.37.5
          CRAP_VERSION=0.6.1
          case "$(uname -m)" in
            aarch64) arch=aarch64 ;;
            x86_64)  arch=x86_64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          # $GITHUB_PATH only affects LATER steps, not this one -- the version
          # assertions below run here, so the dir must be on PATH inside this
          # same script.
          export PATH="$HOME/.local/bin:$PATH"
          curl -sSLf "https://github.com/xd009642/tarpaulin/releases/download/${TARPAULIN_VERSION}/cargo-tarpaulin-${arch}-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          curl -sSLf "https://github.com/minikin/cargo-crap/releases/download/v${CRAP_VERSION}/cargo-crap-${arch}-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo-tarpaulin --version | grep -qx "tarpaulin ${TARPAULIN_VERSION}"
          cargo-crap --version | grep -qx "cargo-crap ${CRAP_VERSION}"

      - name: coverage gate (tarpaulin, llvm engine)
        # Workspace of four members, so --workspace is required to measure them
        # all. Build from the repo root; the workspace Cargo.lock is committed.
        run: >-
          cargo tarpaulin --engine Llvm --workspace --locked
          --out Lcov --fail-under "$COVERAGE_FLOOR" --timeout 600

      - name: CRAP gate (fed by this run's coverage, entry points excluded)
        # Both CLI binaries are entry points — clap/wiring, 0% test coverage by
        # design — and score CRAP in the hundreds. Gate those numbers and the
        # ceiling measures nothing; silence them and the ceiling is meaningful.
        # cargo-crap logs one expected warning on stderr that the excluded LCOV
        # file matched no analyzed source. Everything else is scored.
        run: >-
          cargo crap --lcov lcov.info
          --exclude '**/main.rs'
          --threshold "$CRAP_THRESHOLD" --fail-above
          --format json > crap.json

      - name: census the runner's toolset (estate baseline)
        if: always()
        run: |
          # One-time estate knowledge, measured rather than assumed: the runner
          # images differ between generations, and the summary step once crashed
          # on a missing python3 (exit 127) that reddened a gate which had passed.
          # Future workflow authors check this list instead of learning per-127.
          {
            echo "### Runner toolset"
            echo
            for t in python3 python jq wget curl awk gawk mawk sed tr sort cut tail head xz tar git grep; do
              if command -v "$t" >/dev/null 2>&1; then
                echo "- $t: $(command -v "$t")"
              else
                echo "- $t: MISSING"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: write the run summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Coverage + CRAP gate"
            echo
            if [ -f lcov.info ]; then
              awk -F: '/^LH:/{lh+=$2} /^LF:/{lf+=$2} END {if (lf>0) printf "Line coverage: %.2f%% (%d/%d lines)\n", 100*lh/lf, lh, lf; else print "Line coverage: no LCOV data"}' lcov.info
            else
              echo "Line coverage: no lcov.info (the coverage run did not complete)"
            fi
            if [ -f crap.json ]; then
              # Shell-only parse: some runner images carry no python3, and a
              # crashing summary must not redden a gate that passed.
              vals=$(tr -d ' \n' < crap.json | grep -o '"crap":[0-9.]*' | cut -d: -f2)
              if [ -n "$vals" ]; then
                n=$(printf '%s\n' "$vals" | grep -c .)
                worst=$(printf '%s\n' "$vals" | sort -g | tail -1)
                echo "Functions scored: $n; worst CRAP: $worst; threshold $CRAP_THRESHOLD"
              else
                echo "WARNING: crap.json present but no entries parsed"
              fi
            else
              echo "CRAP: no crap.json (the CRAP step did not complete)"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
