[package]
name = "deagle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for deagle code intelligence — map, search, explain"

[[bin]]
name = "deagle"
path = "src/main.rs"

[features]
default = ["pattern", "text-search"]
pattern = ["deagle-parse/pattern"]
text-search = ["deagle-parse/text-search"]

[dependencies]
deagle-core = { version = "0.3.0", path = "../deagle-core" }
deagle-parse = { version = "0.3.0", path = "../deagle-parse" }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1.10"
globset = "0.4"
tokei = "14"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Tests open the fixture database directly (the zero-node-trap fixture deletes
# a file_hashes row to simulate an unhashable index). Same feature set as
# deagle-core uses, so no second build of the bundled sqlite.
rusqlite = { version = "0.34", features = ["bundled"] }
